<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Товар | YUEYAN BOUTIQUE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="product">
    <div class="page-shell">
      <header class="site-header">
        <a class="brand-mark" href="./index.html">
          <span class="brand-mark__title">YUEYAN BOUTIQUE</span>
          <span class="brand-mark__tag">премиальная косметика</span>
        </a>
        <form class="search-bar search-bar--header" action="./catalog.html" method="get">
          <input type="search" name="q" placeholder="Поиск по бренду или товару..." />
          <button class="button button--primary button--small" type="submit">Поиск</button>
        </form>
        <nav class="site-nav" aria-label="Primary">
          <a href="./catalog.html">Каталог</a>
          <a href="./help.html">Помощь</a>
          <a href="./checkout.html">Оформление</a>
        </nav>
        <button class="cart-button" id="cartToggle" type="button">
          Корзина
          <strong id="cartCount">0</strong>
        </button>
      </header>

      <main>
        <section class="section section--tight">
          <div class="product-detail" id="productDetail"></div>
        </section>

        <section class="section">
          <div class="section-heading">
            <p class="eyebrow">Вам также может понравиться</p>
            <h2>Похожие товары из той же премиальной подборки</h2>
          </div>
          <div class="product-grid" id="relatedProducts"></div>
        </section>
      </main>
    </div>

    <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
      <div class="cart-drawer__header">
        <h2>Корзина</h2>
        <button class="icon-button" id="cartClose" type="button" aria-label="Close cart">×</button>
      </div>
      <div class="cart-drawer__body" id="cartItems"></div>
      <div class="cart-drawer__footer">
        <div class="cart-total">
          <span>Итого по товарам</span>
          <strong id="cartSubtotal">$0</strong>
        </div>
        <a class="button button--primary" href="./checkout.html">Перейти к оформлению</a>
      </div>
    </aside>
    <div class="cart-backdrop" id="cartBackdrop" hidden></div>

    <script src="./store.js"></script>
  </body>
</html>
